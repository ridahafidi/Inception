[www]

; Run PHP workers as www-data instead of root
; Limits filesystem permissions for security
; PHP File uploads re readable by nginx hence both have same user and group in the shared volume
user = www-data
group = www-data

; Listen on TCP port 9000 for FastCGI requests
; Nginx forwards PHP requests to wordpress:9000 instead of using unix socks
listen = 9000

; Process manager mode
; Keeps a pool that grows and shrinks with traffic
pm = dynamic

; Upper limit for concurrent PHP workers
; Caps how many requests PHP-FPM can process at once
pm.max_children = 5

; Target number of workers to start with on boot
; Gives PHP-FPM an initial pool before requests arrive
pm.start_servers = 2

; Minimum idle workers to keep ready for new requests
; Avoids spawning workers only after traffic arrives
pm.min_spare_servers = 1

; Maximum idle workers to keep ready when traffic is low
; Prevents the pool from growing without bound when idle
pm.max_spare_servers = 3

; Keep Docker environment variables available
; Useful for database credentials and container configs
clear_env = no